<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星烬契约 V2.0 Release Preview</title><style>body{margin:0;background:#060815;color:#e8ecfa;font-family:Inter,"PingFang SC",sans-serif}.wrap{max-width:1200px;margin:auto;padding:32px}.hero{width:100%;border-radius:22px;box-shadow:0 24px 80px #0008}.title{font-size:34px;color:#f1dfb0}.muted{color:#9aa7c3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#0e1428;border:1px solid #293250;border-radius:16px;padding:12px}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px}.badge{display:inline-block;padding:4px 8px;border:1px solid #7b6aa9;border-radius:999px;font-size:12px}</style></head><body><div class="wrap"><div class="badge">V2.0 · RELEASE CANDIDATE</div><h1 class="title">星烬契约</h1><p class="muted">Web / Cocos Creator / WeChat Mini Game · 正式试玩资源总览</p><img class="hero" src="assets/release/release-cover-v20.jpg"><h2>章节 Boss Splash</h2><div class="grid" id="boss"></div><h2>角色全屏资源</h2><div class="grid" id="heroes"></div></div><script>const bosses=[5,10,15,20,25,30],heroes=Array.from({length:15},(_,i)=>'h'+String(i+1).padStart(3,'0'));document.querySelector('#boss').innerHTML=bosses.map(s=>`<div class=card><img src="assets/bosses/stage-${s}.jpg"><p>Stage ${s}</p></div>`).join('');document.querySelector('#heroes').innerHTML=heroes.map(h=>`<div class=card><img style="aspect-ratio:4/5" src="assets/characters/${h}_full.jpg"><p>${h}</p></div>`).join('')</script></body></html>
