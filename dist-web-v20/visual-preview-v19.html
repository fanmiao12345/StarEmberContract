<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星烬契约 v1.9 · 视觉资源预览</title><style>body{margin:0;background:#060916;color:#eef2ff;font:14px system-ui;padding:24px}h1,h2{font-weight:600}small{color:#8e98b7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}.card{background:#10152b;border:1px solid #2a3155;border-radius:18px;padding:12px;text-align:center}.card img{width:88px;height:88px;object-fit:contain}.hero img{width:100%;height:220px;object-fit:cover;border-radius:12px}.section{max-width:1100px;margin:0 auto 32px}.bg{height:180px;background-size:cover;background-position:center;border-radius:18px;border:1px solid #2a3155}.tag{color:#e8ca77;font-size:11px;letter-spacing:1px}</style></head><body><div class="section"><div class="tag">VISUAL RELEASE CANDIDATE</div><h1>《星烬契约》v1.9 视觉资源预览</h1><small>角色卡面沿用当前概念稿，技能 / 状态 / Boss / 背景已进入统一资源清单。</small></div><div class="section"><h2>首页 / 战斗 / 抽卡背景</h2><div class="grid"><div class="bg" style="background-image:url('assets/ui/backgrounds/home-nebula.svg')"></div><div class="bg" style="background-image:url('assets/ui/backgrounds/battle-grid.svg')"></div><div class="bg" style="background-image:url('assets/ui/backgrounds/gacha-orbit.svg')"></div><div class="bg" style="background-image:url('assets/ui/backgrounds/event-night.svg')"></div></div></div><div class="section"><h2>15 名角色技能图标</h2><div class="grid" id="skills"></div></div><div class="section"><h2>状态图标</h2><div class="grid" id="status"></div></div><div class="section"><h2>Boss 徽记</h2><div class="grid" id="boss"></div></div><div class="section"><h2>角色卡面</h2><div class="grid" id="heroes"></div></div><script>const names=['夜岚','绯歌','白砚','青禾','司南','乌澜','洛弥','逐影','石钺','明砂','渡鸦','雪芒','墨灯','阿洛','潮生'];skills.innerHTML=names.map((n,i)=>`<div class="card"><img src="assets/ui/skills/h${String(i+1).padStart(3,'0')}.svg"><b>${n}</b></div>`).join('');const sts={stun:'眩晕',silence:'沉默',taunt:'嘲讽',shield:'护盾',cleanse:'净化',break:'破韧',buff:'强化',heal:'治疗'};status.innerHTML=Object.entries(sts).map(([k,n])=>`<div class="card"><img src="assets/ui/status/${k}.svg"><b>${n}</b></div>`).join('');const bs={5:'焚砂巨像',10:'镜潮守望者',15:'无灯猎王',20:'星陨裁决者',25:'裂空古兽',30:'灰烬王座'};boss.innerHTML=Object.entries(bs).map(([k,n])=>`<div class="card"><img src="assets/ui/bosses/stage-${k}.svg"><b>${n}</b></div>`).join('');heroes.innerHTML=names.map((n,i)=>`<div class="card hero"><img src="assets/characters/h${String(i+1).padStart(3,'0')}.jpg"><b>${n}</b></div>`).join('')</script></body></html>
