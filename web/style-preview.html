<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星烬契约 · 角色样式预览</title><link rel="stylesheet" href="styles.css"><style>body{padding:18px}.preview-head{max-width:980px;margin:0 auto 18px}.preview-head h1{margin:0 0 8px}.preview-grid{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.preview-card{background:linear-gradient(160deg,#111d30,#0a1321);border:1px solid #2c4261;border-radius:18px;padding:12px;overflow:hidden}.preview-portrait{height:260px;border-radius:16px;overflow:hidden;margin-bottom:10px}.preview-portrait .hero-portrait{width:100%;height:100%;border-radius:16px}.preview-card h2{margin:0;font-size:17px}.preview-card p{font-size:11px;color:#91a2b8;line-height:1.6;margin:6px 0}.palette{display:flex;gap:6px;margin-top:8px}.palette i{width:24px;height:8px;border-radius:999px;display:block}.meta{font-size:10px;color:#d8e1ed;display:flex;gap:6px;flex-wrap:wrap}.meta span{background:#18263b;padding:3px 6px;border-radius:999px}</style></head><body>
<div class="preview-head"><div class="kicker">ART DIRECTION · v0.7</div><h1>《星烬契约》角色样式预览</h1><p class="muted">当前页面已接入首批概念卡面裁切资源，展示阵营配色、角色轮廓和手游卡面方向；后续可逐张替换为正式透明立绘。</p></div>
<div id="preview" class="preview-grid"></div>
<script src="game-data.js"></script><script>
const G=window.STAR_EMBER_GAME;
function portrait(h){return `<div class="hero-portrait portrait-${h.id} art-loaded"><img src="assets/characters/${h.id}.jpg" alt="${h.name}"><div class="portrait-sigil">✦</div></div>`}
document.getElementById('preview').innerHTML=G.HEROES.map(h=>{const v=G.HERO_VISUALS[h.id];return `<article class="preview-card"><div class="preview-portrait">${portrait(h)}</div><div class="meta"><span class="rarity-${h.rarity}">${h.rarity}</span><span>${h.faction}</span><span>${h.role}</span></div><h2>${h.name} · ${v.title}</h2><p>${v.hair} · ${v.weapon}</p><p>${v.motif}</p><div class="palette">${v.palette.map(c=>`<i style="background:${c}"></i>`).join('')}</div></article>`}).join('');
</script></body></html>
